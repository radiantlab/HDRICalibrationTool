# This workflow builds the app when triggered by a pull request to main and is used for
# validation of pull requests. Assets are uploaded upon completion.

# Created using https://github.com/tauri-apps/tauri-action/blob/dev/examples/test-build-only.yml

name: test-on-pr-and-push
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# This workflow will build your tauri app without uploading it anywhere.

jobs:
  test-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: cache next and node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}


      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        # webkitgtk 4.0 is for Tauri v1 - webkitgtk 4.1 is for Tauri v2.
        # You can remove the one that doesn't apply to your app to speed up the workflow a bit.

      - name: install frontend dependencies
        run: npm install # change this to npm, pnpm or bun depending on which one you use.

      # If tagName and releaseId are omitted tauri-action will only build the app and won't try to upload any asstes.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload build artifact - Ubuntu
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: src-tauri/target/release/bundle/deb/*.deb

      - name: Upload build artifact - Mac (Universal)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload build artifact - Windows
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: src-tauri/target/release/bundle/msi/*.msi

  e2e-tests:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        platform: ['windows-latest', 'ubuntu-22.04']
    runs-on: ${{ matrix.platform }}
    env:
      # Pinned to specific releases deliberately -- LBNL-ETA/Radiance tags
      # every commit to master, so "latest" would be a moving target.
      RADIANCE_RELEASE_TAG: 39b99660
      HDRGEN_RELEASE_TAG: v1.0.1
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: install Radiance and hdrgen (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          curl -sL -o radiance.zip "https://github.com/LBNL-ETA/Radiance/releases/download/${RADIANCE_RELEASE_TAG}/Radiance_${RADIANCE_RELEASE_TAG}_Linux.zip"
          unzip -q radiance.zip -d radiance-outer
          tar xzf radiance-outer/*.tar.gz -C "$RUNNER_TEMP"
          radiance_bin="$(find "$RUNNER_TEMP" -type d -path '*/radiance/bin' | head -n1)"
          chmod +x "$radiance_bin"/*
          echo "E2E_RADIANCE_PATH=$radiance_bin" >> "$GITHUB_ENV"

          mkdir -p "$RUNNER_TEMP/hdrgen"
          curl -sL -o hdrgen.zip "https://github.com/radiance-org/hdrgen/releases/download/${HDRGEN_RELEASE_TAG}/ubuntu-latest-binaries.zip"
          unzip -q hdrgen.zip -d "$RUNNER_TEMP/hdrgen"
          chmod +x "$RUNNER_TEMP/hdrgen"/*
          echo "E2E_HDRGEN_PATH=$RUNNER_TEMP/hdrgen" >> "$GITHUB_ENV"

      - name: install Radiance and hdrgen (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/radiance"
          curl -sL -o radiance.zip "https://github.com/LBNL-ETA/Radiance/releases/download/${RADIANCE_RELEASE_TAG}/Radiance_${RADIANCE_RELEASE_TAG}_Windows.zip"
          unzip -q radiance.zip -d "$RUNNER_TEMP/radiance"
          echo "E2E_RADIANCE_PATH=$RUNNER_TEMP/radiance/bin" >> "$GITHUB_ENV"

          mkdir -p "$RUNNER_TEMP/hdrgen"
          curl -sL -o hdrgen.zip "https://github.com/radiance-org/hdrgen/releases/download/${HDRGEN_RELEASE_TAG}/windows-latest-binaries.zip"
          unzip -q hdrgen.zip -d "$RUNNER_TEMP/hdrgen"
          echo "E2E_HDRGEN_PATH=$RUNNER_TEMP/hdrgen" >> "$GITHUB_ENV"

      - name: install frontend dependencies
        run: npm install

      - name: install e2e test dependencies
        working-directory: e2e-tests
        run: npm install

      - name: run e2e tests (Linux, headless)
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: e2e-tests
        run: xvfb-run --auto-servernum npm test

      - name: run e2e tests (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: e2e-tests
        run: npm test